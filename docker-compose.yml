version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockbuddy_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - ENVIRONMENT=production
      - LOG_FORMAT=json
      - SB_MAX_WORKER_THREADS=4
      - SB_INFERENCE_CACHE_TTL_S=3600
    volumes:
      - stockbuddy_artifacts:/app/model_artifacts
      - stockbuddy_cache:/app/inference_cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.25-alpine
    container_name: stockbuddy_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  stockbuddy_artifacts:
    driver: local
  stockbuddy_cache:
    driver: local
