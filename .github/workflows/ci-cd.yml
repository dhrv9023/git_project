name: StockBuddy CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: 🧪 Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Static Analysis
        run: |
          python -m pyflakes app.py ml/ core/

      - name: Run Unit Tests
        run: |
          pytest tests/ -v --tb=short

  docker-build-and-healthcheck:
    name: 🐳 Docker Build & Health Probe Verification
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-docker-action@v3
        ignore: true

      - name: Build Docker Image
        run: |
          docker build -t stockbuddy:ci .

      - name: Test Container Execution & Health Check
        run: |
          docker run -d --name stockbuddy_test -p 5000:5000 -e ENVIRONMENT=staging stockbuddy:ci
          echo "Waiting for container initialization..."
          sleep 5

          # Retry curl up to 6 times
          for i in {1..6}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ Container /health probe passed (HTTP 200)"
              break
            fi
            echo "Attempt $i: HTTP $STATUS, retrying in 3s..."
            sleep 3
          done

          # Verify /ready probe
          READY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/ready || echo "000")
          echo "Container /ready probe response HTTP $READY_STATUS"
          if [ "$READY_STATUS" != "200" ]; then
            docker logs stockbuddy_test
            exit 1
          fi

      - name: Stop & Cleanup Test Container
        if: always()
        run: |
          docker stop stockbuddy_test || true
          docker rm stockbuddy_test || true

  deploy:
    name: 🚀 Automated Cloud Deployment
    runs-on: ubuntu-latest
    needs: docker-build-and-healthcheck
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render Deploy Webhook
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            echo "Triggering Render continuous deployment hook..."
            curl -s -X POST "$RENDER_HOOK"
            echo "✓ Render deploy triggered successfully."
          else
            echo "ℹ RENDER_DEPLOY_HOOK_URL secret not set. Skipping automated webhook."
          fi
